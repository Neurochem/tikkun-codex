  <h1>Enochian Key 1</h1>
  <div class="content">
    <h2>Ol Sonf Vorsg</h2>
    <p><strong>English</strong>: "I reign over you, saith the God of Justice..."</p>
    <p><strong>Qiskit Circuit</strong>: H-X-Z-H-X (5 qubits)</p>
    <canvas id="enochian-mandala" width="400" height="400"></canvas>
    <p><em>Click to activate 432Hz tone.</em></p>

    <p><a href="https://cosmicmike2.gumroad.com/l/enochian">Get Full Enochian Volume ($39)</a></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/addons/p5.sound.min.js"></script>
  <script>
    let osc, playing = false;
    function setup() {
      let canvas = createCanvas(400, 400);
      canvas.parent('enochian-mandala');
      textAlign(CENTER, CENTER);
    }
    function draw() {
      background(0);
      translate(200, 200);
      stroke(255, 165, 0);
      noFill();
      for (let i = 0; i < 18; i++) {
        push();
        rotate(i * 20 + frameCount * 0.01);
        beginShape();
        for (let a = 0; a < 360; a += 10) {
          let r = 100 + sin(a * 5) * 30;
          vertex(r * cos(a), r * sin(a));
        }
        endShape(CLOSE);
        pop();
      }
      fill(255);
      text("Key 1", 0, 0);
    }
    function mousePressed() {
      if (!playing) {
        osc = new p5.Oscillator('sine');
        osc.freq(432);
        osc.amp(0.3);
        osc.start();
        playing = true;
      } else {
        osc.stop();
        playing = false;
      }
    }
  </script>
